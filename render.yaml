services:
  - type: web
    name: heurisko-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn research_system.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
